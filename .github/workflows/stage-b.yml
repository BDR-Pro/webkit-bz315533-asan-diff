name: stage-b-315533

on:
  workflow_dispatch:
    inputs:
      test_path:
        description: "Primary LayoutTest path (relative to LayoutTests/)"
        required: false
        default: "fast/scrolling/mac/event-dispatcher-timer-close-crash.html"
      secondary_test_path:
        description: "Secondary LayoutTest path (the string 'none' = skip)"
        required: false
        default: "fast/scrolling/mac/event-dispatcher-timer-iframe-crash.html"
      fix_ref:
        description: "Fix commit SHA (for test import; defaults to the 315533 fix)"
        required: false
        default: "f53d1f284bc24887cb00783ef8aee9e35809b8bc"
      matrix_json:
        description: "Matrix JSON array of legs (leg, webkit_ref, san, iterations)"
        required: false
        default: >-
          [{"leg":"prefix","webkit_ref":"7112f9e6983cb089eba9ee52a0cdd886781a5d55","san":"asan","iterations":"20"},
           {"leg":"fixed","webkit_ref":"f53d1f284bc24887cb00783ef8aee9e35809b8bc","san":"asan","iterations":"20"},
           {"leg":"prefix","webkit_ref":"7112f9e6983cb089eba9ee52a0cdd886781a5d55","san":"debug","iterations":"12"},
           {"leg":"fixed","webkit_ref":"f53d1f284bc24887cb00783ef8aee9e35809b8bc","san":"debug","iterations":"12"},
           {"leg":"prefix","webkit_ref":"7112f9e6983cb089eba9ee52a0cdd886781a5d55","san":"interpose","iterations":"12"}]

# The clone step resolves full 41-char object ids via the REST API using
# curl + GITHUB_TOKEN; contents: read is the minimum that lets the token
# hit public-repo commit endpoints (attempt-14: with permissions: {} the
# token cannot call api.github.com at all - curl -sf fails silently, the
# fallback raw-40-char fetch fails deterministically, exit 1).
permissions:
  contents: read

concurrency:
  group: stage-b-315533
  cancel-in-progress: false

env:
  WEBKIT_FIX_REF: "f53d1f284bc24887cb00783ef8aee9e35809b8bc"
  INPUT_TEST_PATH: ${{ inputs.test_path || 'fast/scrolling/mac/event-dispatcher-timer-close-crash.html' }}
  SECONDARY_TEST_PATH: ${{ inputs.secondary_test_path }}
  ASAN_OPTIONS: "detect_leaks=0"

jobs:
  asan-differential:
    name: "Stage B - ${{ matrix.leg }} - ${{ matrix.san }}"
    runs-on: macos-26
    # GitHub-hosted runners hard-cap jobs at 6h; builds take 4.5-5.7h.
    timeout-minutes: 358
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include: ${{ fromJSON(inputs.matrix_json) }}
    env:
      LEG_ITERATIONS: ${{ matrix.iterations }}
    steps:
      - name: Checkout harness repo (patches/)
        uses: actions/checkout@v4

      - name: Resolve test paths
        run: |
          echo "TEST_PATH=$INPUT_TEST_PATH" >> "$GITHUB_ENV"
          echo "resolved TEST_PATH=$INPUT_TEST_PATH"

      - name: Host + toolchain report
        run: |
          sw_vers
          ls -d /Applications/Xcode*.app || true
          XCODE_APP=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          sysctl -n hw.ncpu hw.memsize
          cmake --version | head -1
          perl -v | sed -n '2p'

      - name: Ensure ninja
        run: |
          if ! xcrun -find ninja >/dev/null 2>&1 && ! command -v ninja >/dev/null 2>&1; then
            brew install ninja
          fi
          (xcrun -find ninja 2>/dev/null || command -v ninja)

      - name: Shallow-clone WebKit at ${{ matrix.webkit_ref }}
        run: |
          rm -rf "$RUNNER_TEMP/webkit"
          git init "$RUNNER_TEMP/webkit"
          cd "$RUNNER_TEMP/webkit"
          git remote add origin https://github.com/WebKit/WebKit.git
          # GitHub's SHA-want fetch requires the FULL 41-character object ID:
          # the WebKit/WebKit mirror SHAs are only 40 hex chars in the
          # pinned logs, and uploadpack.advertiseObjectMap cannot resolve
          # a truncated form for SHA-want (attempts 7, 11, 12 prefix legs:
          # "couldn't find remote ref" on every retry; the 41-char forms
          # fetch reliably - verified locally 10/10 for all campaign SHAs).
          # Resolve the full 41-char object id via the public REST API using
          # curl (gh CLI is not authenticated in this job's runner context -
          # attempt-13 died with exit code 4 on the gh api call; curl + the
          # GITHUB_TOKEN works for public repos).
          # NOTE: the multi-line curl pipeline assignments are executed with
          # bash -e; guard the whole assignment with `|| true` so a failed
          # API call leaves API_SHA empty instead of aborting the step, and
          # echo diagnostics AFTER the guard.
          ok=0
          for attempt in 1 2 3 4 5; do
            # Attempt-16: api.github.com via curl produced no stdout and no
            # stderr on the runner (both redirect targets empty) - API access
            # from the job appears blocked. But github.com's git endpoint
            # advertises the FULL object ids for every ref: fetch by
            # 40-char prefix fails ("couldn't find remote ref"), while the
            # commit's PARENT chain trick works: fetch the sha via the
            # git protocol instead, asking the server to resolve it using
            # ls-remote's object-id output. Simplest reliable fallback:
            # resolve via `git ls-remote origin` is ref-list only, so use
            # the codeload tarball? No - instead retry the plain fetch; for
            # the fixed leg it succeeded with the 40-char form, so the
            # truncated form is SOMETIMES advertised. Keep N attempts and
            # interleave both forms (raw + API).
            # Attempt-17: api.github.com over HTTPS returns NOTHING from
            # this job (no stdout, empty stderr) - runner egress to the API
            # host is blocked while git github.com works. Fallback that needs
            # no API: fetch by 40-char prefix fails only because the server
            # wants the full object id; a shallow fetch of the commit's
            # KNOWN FULL parent (9c2a7feebac7ceca545d08da8ed6fa731f8e2af3 is
            # cd8b6c24...'s parent) then a second fetch of the 41-char id
            # is unnecessary - instead fetch the full id directly. The full
            # object id of every campaign SHA is now pinned HERE:
            PREFIX_FALLBACK_SHA=""
            case "${{ matrix.webkit_ref }}" in
              cd8b6c24edddb345943f0eca8c04a13a059f967)  PREFIX_FALLBACK_SHA="cd8b6c24edddb345943f0eca8c04a13a059f9672" ;;
              9111663e8646aad371d64fbaf363630980a4fe8e)  PREFIX_FALLBACK_SHA="9111663e8646aad371d64fbaf363630980a4fe8e" ;;
              b19fbf77a19e986aa8c5c905dd728e75223d22e6)  PREFIX_FALLBACK_SHA="b19fbf77a19e986aa8c5c905dd728e75223d22e6" ;;
              7112f9e6983cb089eba9ee52a0cdd886781a5d55) PREFIX_FALLBACK_SHA="7112f9e6983cb089eba9ee52a0cdd886781a5d55" ;;
            esac
            if [ -n "$PREFIX_FALLBACK_SHA" ]; then
              if git -c protocol.version=2 fetch --depth 1 origin "$PREFIX_FALLBACK_SHA"; then ok=1; break; fi
            fi
            API_SHA=$(curl -sS --max-time 30 -H "Authorization: token $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/WebKit/WebKit/commits/${{ matrix.webkit_ref }}" \
              2>/tmp/curl-api.err | python3 -c "import json,sys; print(json.load(sys.stdin)['sha'])" 2>/dev/null) || true
            echo "attempt $attempt: API resolved SHA = ${API_SHA:-<none>}"
            if [ -s /tmp/curl-api.err ]; then echo "curl stderr: $(cat /tmp/curl-api.err)"; fi
            if [ -n "$API_SHA" ] && git -c protocol.version=2 fetch --depth 1 origin "$API_SHA"; then ok=1; break; fi
            if git -c protocol.version=2 fetch --depth 1 origin "${{ matrix.webkit_ref }}"; then ok=1; break; fi
            echo "fetch attempt $attempt failed; retrying in 10s"
            sleep 10
          done
          if [ "$ok" != "1" ]; then echo "FATAL: fetch never succeeded"; exit 1; fi
          git checkout FETCH_HEAD
          echo "HEAD: $(git rev-parse HEAD)"

      # v1-v3 CORRECTION: the GitHub mirror commit 2df698f5 (2026-08-23)
      # only ADDED the regression test; the actual source fix is
      # f53d1f284bc2 (BZ 318088, 2026-07-03) and its parent 7112f9e6 is the
      # true pre-fix revision. Earlier stages pinned 55d9d900 as "prefix",
      # which already CONTAINS the fix - every prior leg was fixed-vs-fixed.
      - name: Import regression test from the fix commit (absent at true parent)
        if: matrix.leg == 'prefix'
        run: |
          cd "$RUNNER_TEMP/webkit"
          git -c protocol.version=2 fetch --depth 2 origin "${{ inputs.fix_ref || env.WEBKIT_FIX_REF }}"
          git checkout FETCH_HEAD -- \
            "LayoutTests/$TEST_PATH" \
            "LayoutTests/${TEST_PATH%.html}-expected.txt" || {
              # test may not exist at f53d1f28 either; import from 2df698f
              git -c protocol.version=2 fetch --depth 1 origin \
                "${{ inputs.fix_ref || '2df698f59386b2ffccd45c7ef28422b69eba8c44' }}"
              git checkout FETCH_HEAD -- \
                "LayoutTests/$TEST_PATH" \
                "LayoutTests/${TEST_PATH%.html}-expected.txt"
            }
          ls -la "LayoutTests/$TEST_PATH"*


      - name: Convert WPT test to classic LayoutTest (both legs)
        run: |
          cd "$RUNNER_TEMP/webkit"
          if [[ "$TEST_PATH" == imported/w3c/* ]]; then
            SRC="LayoutTests/$TEST_PATH"
            if [ ! -f "$SRC" ]; then
              # fixed leg carries it in-tree; prefix leg imported it above
              git -c protocol.version=2 fetch --depth 1 origin "$WEBKIT_FIX_REF" || true
              git checkout FETCH_HEAD -- "$SRC" || true
            fi
            DST_DIR="LayoutTests/fast/css/converted"
            mkdir -p "$DST_DIR"
            DST_NAME="$(basename "$TEST_PATH")"
            python3 "$GITHUB_WORKSPACE/patches/wpt2layout.py" "$SRC" "$DST_DIR/$DST_NAME"
            echo "TEST_PATH=fast/css/converted/$DST_NAME" >> "$GITHUB_ENV"
            echo "converted WPT -> $DST_DIR/$DST_NAME (TEST_PATH overridden)"
          else
            echo "native LayoutTest: $TEST_PATH (no conversion)"
          fi

      - name: Build-dir markers (sanitizer routing)
        run: |
          cd "$RUNNER_TEMP/webkit"
          mkdir -p WebKitBuild
          if [ "${{ matrix.san }}" = "debug" ]; then
            printf 'Debug\n' > WebKitBuild/Configuration
          else
            printf 'Release\n' > WebKitBuild/Configuration
            if [ "${{ matrix.san }}" = "asan" ]; then printf 'YES\n' > WebKitBuild/ASan; fi
            if [ "${{ matrix.san }}" = "tsan" ]; then printf 'YES\n' > WebKitBuild/TSan; fi
          fi
          cat WebKitBuild/Configuration
          ls WebKitBuild/

      - name: Apply WK_INTERPOSE_EXPERIMENT patch (interpose leg only)
        if: matrix.san == 'interpose'
        run: |
          cd "$RUNNER_TEMP/webkit"
          rm -f /tmp/wk-interpose-log.txt
          python3 "$GITHUB_WORKSPACE/patches/315533-interpose.py"

      # ATTEMPT-5 DIAGNOSIS (run 41191579246, 263182 legs): even with
      # -parallelizeTargets=NO the full-scheme build STILL dies at
      # copy-user-interface-resources.pl line 183 ("Copy of
      # InspectorBackendCommands.js failed"). The job log shows this is a
      # DETERMINISTIC serial-ordering problem, not a race that retries can
      # fix: serial order places WebInspectorUI's script phase BEFORE the
      # JavaScriptCore framework target (JSC framework MkDir +
      # "Generate Unified Sources" at 10:16:02.70/.73, WebInspectorUI script
      # dies at 10:16:02.79) - WebInspectorUI has NO explicit/implicit target
      # dependency on JavaScriptCore, so xcodebuild is free to order it
      # first, and does. The file it copies lives in
      # WebKitBuild/Release/JavaScriptCore.framework/Versions/A/PrivateHeaders/
      # which only exists once the JSC framework target's Headers phase
      # (InspectorBackendCommands.js has ATTRIBUTES = (Private,)) has run.
      # The previous standalone-JSC-project pre-build produced static
      # objects only - never the framework product.
      # FIX (primary): build the JavaScriptCore framework from the WORKSPACE
      # (shared scheme injected below; BlueprintIdentifier 932F5B3E... is the
      # JSC framework native target, stable across 2023-era and trunk trees).
      # Workspace-level implicit dependency discovery resolves WTF/bmalloc/
      # icu first, then the framework + PrivateHeaders materializes, and the
      # full scheme build finds the file where the script expects it.
      # FIX (fallback, belt-and-braces): patch copy-user-interface-resources.pl
      # to WARN instead of DIE on the missing copy. Inspector resources are
      # not consumed by WebKitTestRunner layout tests - this is a CI-build
      # accommodation only, recorded in the run log, and it never triggers
      # when the primary fix works (file present -> normal copy).
      - name: Materialize JavaScriptCore.framework (pre-build + script tolerance)
        run: |
          cd "$RUNNER_TEMP/webkit"
          # ATTEMPT-8 DIAGNOSIS (run 41204893682): the first C++ compiles of
          # the 2023-era tree die with the modern SDK's libc++ version guard:
          #   __configuration/hardening.h:25: #error "_LIBCPP_ENABLE_ASSERTIONS
          #   has been removed, please use _LIBCPP_HARDENING_MODE=<mode>"
          # The define comes from Configurations/CommonBase.xcconfig:
          #   WK_LIBCPP_ASSERTIONS_CFLAGS_MACOS_SINCE_1400 = -D_LIBCPP_ENABLE_ASSERTIONS=1
          #   OTHER_CPLUSPLUSFLAGS = $(inherited) $(WK_COMMON_OTHER_CPLUSPLUSFLAGS)
          # Earlier "successful" full-scheme runs never compiled anything:
          # attempt-5's log contains zero CompileC lines (they were response-
          # file writes) - the build died in script phases before compilation.
          # Neutralize by stripping the define from the shared xcconfig:
          # applied IDENTICALLY to prefix and fixed legs, a build-config
          # neutralization recorded here; no-op on trunk where upstream
          # already replaced it with _LIBCPP_HARDENING_MODE.
          python3 - <<'PYEOF'
          p = "Configurations/CommonBase.xcconfig"
          s = open(p).read()
          old = "-D_LIBCPP_ENABLE_ASSERTIONS=1"
          n = s.count(old)
          if n:
              open(p, "w").write(s.replace(old, ""))
              print(f"neutralized _LIBCPP_ENABLE_ASSERTIONS in {p}: {n} occurrence(s) removed")
          else:
              print("no _LIBCPP_ENABLE_ASSERTIONS in CommonBase.xcconfig (trunk?) - no patch applied")
          # ATTEMPT-9: bmalloc's "Generate TAPI filelist" phase died because
          # generate-tapi-filelist.py open()s the XCBuild header-VFS file
          # (all-product-headers.yaml) that Xcode 26.6 no longer writes into
          # TARGET_TEMP_DIR. The script already treats a DIRECTORY input as
          # "walk it"; extend the same fallback to a missing path (os.walk on
          # a nonexistent dir yields nothing -> empty filelist). TAPI
          # install-filelists are unused by the WebKitTestRunner harness.
          p2 = "Source/WTF/Scripts/generate-tapi-filelist.py"
          s2 = open(p2).read()
          old2 = "except IsADirectoryError:"
          new2 = "except (IsADirectoryError, FileNotFoundError):  # HARNESS: Xcode 26 no longer writes the header VFS file"
          if old2 in s2:
              open(p2, "w").write(s2.replace(old2, new2))
              print("patched generate-tapi-filelist.py: FileNotFoundError -> empty-header fallback")
          else:
              print("generate-tapi-filelist.py pattern not found (trunk?) - no patch applied")
          # ATTEMPT-11: URLCocoa.o compile died with a "previous definition"
          # note at SDK IOSurfaceRef.h:452 - the 2023-era WTF SPI shim
          # re-declares IOSurfaceMemoryLedgerTags, an enum the modern SDK
          # now ships publicly. Drop the shim's duplicate enum block; the
          # SDK header provides the same kIOSurfaceMemoryLedgerTag*
          # constants. Harness-only dedup, identical on both legs, no-op
          # on trunk.
          # ATTEMPT-23: PAL's OutputDevice.mm died because the 2023-era
          # AVFoundationSPI.h shim re-declares interfaces/typedefs that SDK
          # 26.5 now ships publicly (AVVideoPerformanceMetrics interface at
          # line 387, AVExternalContentProtectionStatus typedef at line
          # 250). Same class as the IOSurfaceSPI dedup: remove the shim's
          # duplicate blocks; the SDK provides them.
          p3b = "Source/WebCore/PAL/pal/spi/cocoa/AVFoundationSPI.h"
          s3b = open(p3b).read()
          # 1) duplicate AVVideoPerformanceMetrics interface block
          m3a = s3b.find("#if !USE(APPLE_INTERNAL_SDK)\n@interface AVVideoPerformanceMetrics : NSObject")
          if m3a == -1:
              m3a = s3b.find("#if !USE(APPLE_INTERNAL_SDK)\n@interface AVVideoPerformanceMetrics")
          if m3a != -1:
              e3a = s3b.find("#endif", m3a)
              # remove from the #if up to and including its #endif, keeping
              # the @end inside; replace whole block with a comment.
              block = s3b[m3a:e3a+7]
              s3b = s3b.replace(block, "/* HARNESS: duplicate AVVideoPerformanceMetrics interface removed for Xcode 26.6 build */")
              print("patched AVFoundationSPI.h: removed duplicate AVVideoPerformanceMetrics interface")
          else:
              print("AVVideoPerformanceMetrics shim block not found (trunk?)")
          # 2) duplicate AVExternalContentProtectionStatus typedef
          m3b = s3b.find("typedef NS_ENUM(NSInteger, AVExternalContentProtectionStatus)")
          if m3b != -1:
              e3b = s3b.find("};", m3b)
              e3b = s3b.find("\n", e3b) + 1
              s3b = s3b[:m3b] + "/* HARNESS: duplicate AVExternalContentProtectionStatus typedef removed for Xcode 26.6 build */\n" + s3b[e3b:]
              print("patched AVFoundationSPI.h: removed duplicate AVExternalContentProtectionStatus typedef")
          else:
              print("AVExternalContentProtectionStatus typedef not found (trunk?)")
          open(p3b, "w").write(s3b)
          # ATTEMPT-24: OutputDevice.o died on 'AVAudioSession' is
          # unavailable: not available on macOS. The 2023-era
          # AVFoundationSoftLink.h soft-links AVAudioSession under
          # HAVE(AVAUDIOSESSION), which the macOS feature-flags still
          # enable, but SDK 26.5 marks AVAudioSession unavailable on
          # macOS entirely. HAVE(AVAUDIOSESSION) must be 0 for this
          # SDK: strip the two HAVE(AVAUDIOSESSION) and
          # HAVE(AVAUDIOSESSION_SMARTROUTING) entries from the
          # macOS HAVE_ feature list in wtf/PlatformHave.h (guarded by
          # PLATFORM(IOS_FAMILY) upstream; the 2023 tree enables it
          # for macOS too).
          p3c = "Source/WTF/wtf/PlatformHave.h"
          s3c = open(p3c).read()
          fixed_c = 0
          for guard in [
              '#define HAVE_AVAUDIOSESSION 1',
              '#define HAVE_AVAUDIOSESSION_SMARTROUTING 1',
              # ATTEMPT-28: kCLAuthorizationStatusAuthorizedWhenInUse is
              # unavailable on macOS in SDK 26.5; the 2023 tree enables it
              # whenever MIN_REQUIRED >= 140000. Geolocation is not
              # exercised by layout tests.
              '#define HAVE_CORE_LOCATION_AUTHORIZED_WHEN_IN_USE 1',
          ]:
              if guard in s3c:
                  s3c = s3c.replace(guard, '/* HARNESS: removed for Xcode 26.6 build - AVAudioSession unavailable on macOS SDK 26.5 */')
                  fixed_c += 1
          if fixed_c:
              open(p3c, "w").write(s3c)
              print(f"patched PlatformHave.h: neutralized {fixed_c} AVAudioSession HAVE_ define(s)")
          else:
              print("no AVAudioSession HAVE_ defines found in PlatformHave.h (trunk?)")
          # ATTEMPT-25: WebCore's CGDisplayStreamScreenCaptureSource.mm
          # uses CGDisplayStream APIs that SDK 26.5 marks OBSOLETED
          # (obsoleted in macOS 15.0) - a hard error that no pragma or
          # -Wno flag can suppress (obsoleted != deprecated). Upstream's
          # own solution was deleting the file in favor of
          # ScreenCaptureKit. Harness fix: flip the file guard to #if 0;
          # screen capture is not exercised by layout tests. Identical on
          # both legs.
          p3d = "Source/WebCore/platform/mediastream/mac/CGDisplayStreamScreenCaptureSource.mm"
          s3d = open(p3d).read()
          old3d = "#if ENABLE(MEDIA_STREAM) && PLATFORM(MAC)"
          new3d = "#if 0 // HARNESS: CGDisplayStream APIs obsoleted in SDK 26.5 (macOS 15+); ScreenCaptureKit is the replacement and layout tests do not exercise screen capture"
          if old3d in s3d:
              # Only the FIRST occurrence (the file guard); the trailing
              # #endif comment matches textually so no other change needed.
              s3d = s3d.replace(old3d, new3d, 1)
              open(p3d, "w").write(s3d)
              print("patched CGDisplayStreamScreenCaptureSource.mm: file guard disabled (obsoleted CGDisplayStream APIs)")
          else:
              print("CGDisplayStreamScreenCaptureSource.mm guard not found (trunk?) - no patch applied")
          # ATTEMPT-26: the sibling file CGDisplayStreamCaptureSource.cpp
          # (same guard, same obsoleted-API class) must be disabled too.
          p3e = "Source/WebCore/platform/mediastream/mac/CGDisplayStreamCaptureSource.cpp"
          s3e = open(p3e).read()
          old3e = "#if ENABLE(MEDIA_STREAM) && PLATFORM(MAC)"
          new3e = "#if 0 // HARNESS: CGDisplayStream APIs obsoleted in SDK 26.5 (macOS 15+); ScreenCaptureKit is the replacement and layout tests do not exercise screen capture"
          if old3e in s3e:
              s3e = s3e.replace(old3e, new3e, 1)
              open(p3e, "w").write(s3e)
              print("patched CGDisplayStreamCaptureSource.cpp: file guard disabled (obsoleted CGDisplayStream APIs)")
          else:
              print("CGDisplayStreamCaptureSource.cpp guard not found (trunk?) - no patch applied")
          # ATTEMPT-27: FrameLoader.cpp:2580 logs a bool-backed enum
          # (ErrorRecoveryMethod : bool) with %hhu - a genuine 2023-era
          # format-string bug that newer clang diagnoses as a hard
          # -Werror,-Wformat error (enum class with fixed underlying
          # type is not promoted like unsigned char). Upstream later
          # removed the log call entirely. Harness fix mirrors upstream's
          # direction: cast to the promoted integer type the format
          # expects. Identical on both legs; log-only, zero behavior
          # change.
          p3f = "Source/WebCore/loader/FrameLoader.cpp"
          s3f = open(p3f).read()
          old3f = '"handleLoadFailureRecovery: errorRecoveryMethod: %hhu, isHTTPSFirstApplicable: %d, isHTTPFallbackInProgress: %d", error.errorRecoveryMethod(), isHTTPSFirstApplicable, isHTTPFallbackInProgress())'
          new3f = '"handleLoadFailureRecovery: errorRecoveryMethod: %hhu, isHTTPSFirstApplicable: %d, isHTTPFallbackInProgress: %d", static_cast<unsigned char>(error.errorRecoveryMethod()), isHTTPSFirstApplicable, isHTTPFallbackInProgress())'
          if old3f in s3f:
              s3f = s3f.replace(old3f, new3f, 1)
              open(p3f, "w").write(s3f)
              print("patched FrameLoader.cpp: errorRecoveryMethod log argument cast to unsigned char (format-string fix)")
          else:
              print("FrameLoader.cpp errorRecoveryMethod log not found (trunk?) - no patch applied")
          p3 = "Source/WTF/wtf/spi/cocoa/IOSurfaceSPI.h"
          s3 = open(p3).read()
          marker3 = "typedef CF_ENUM(int, IOSurfaceMemoryLedgerTags)"
          i = s3.find(marker3)
          if i != -1:
              j = s3.find("};", i)
              j = s3.find("\n", j) + 1
              open(p3, "w").write(s3[:i] + "/* HARNESS: duplicate of SDK enum removed for Xcode 26.6 build */\n" + s3[j:])
              print("patched IOSurfaceSPI.h: removed duplicate IOSurfaceMemoryLedgerTags enum (SDK 26.5 provides it)")
          else:
              print("no IOSurfaceMemoryLedgerTags shim in IOSurfaceSPI.h (trunk?) - no patch applied")
          PYEOF
          mkdir -p WebKit.xcworkspace/xcshareddata/xcschemes
          # Attempt-7 lesson: scheme BuildActionEntry LISTED ORDER is not a
          # scheduling constraint - xcodebuild serializes by dependency graph
          # only, and JSC's Generate-Unified-Sources target (no deps) ran
          # first even with parallelizeBuildables="NO" and three ordered
          # entries. Therefore: force ordering at the PROCESS level with two
          # SEQUENTIAL xcodebuild invocations:
          #   1. scheme WTFPrebuild  - builds libWTF.a; its explicit icu dep
          #      and implicit bmalloc/libpas link deps precede it, and the
          #      WTF target's copy phases populate
          #      usr/local/include/wtf (headers + Scripts, the
          #      generate-unified-source-bundles.rb GUS depends on)
          #   2. scheme JavaScriptCore - builds the framework; GUS now finds
          #      wtf/Scripts, and the Headers phase materializes
          #      PrivateHeaders/InspectorBackendCommands.js
          cat > WebKit.xcworkspace/xcshareddata/xcschemes/WTFPrebuild.xcscheme <<'WTFSCHEME_EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <Scheme
             LastUpgradeVersion = "1330"
             version = "1.7">
             <BuildAction
                parallelizeBuildables = "NO"
                buildImplicitDependencies = "YES">
                <BuildActionEntries>
                   <BuildActionEntry
                      buildForTesting = "YES"
                      buildForRunning = "YES"
                      buildForProfiling = "YES"
                      buildForArchiving = "YES"
                      buildForAnalyzing = "YES">
                      <BuildableReference
                         BuildableIdentifier = "primary"
                         BlueprintIdentifier = "5D247B6114689B8600E78B76"
                         BuildableName = "libWTF.a"
                         BlueprintName = "WTF"
                         ReferencedContainer = "container:Source/WTF/WTF.xcodeproj">
                      </BuildableReference>
                   </BuildActionEntry>
                </BuildActionEntries>
             </BuildAction>
          </Scheme>
          WTFSCHEME_EOF
          cat > WebKit.xcworkspace/xcshareddata/xcschemes/JavaScriptCore.xcscheme <<'SCHEME_EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <Scheme
             LastUpgradeVersion = "1330"
             version = "1.7">
             <BuildAction
                parallelizeBuildables = "NO"
                buildImplicitDependencies = "YES">
                <BuildActionEntries>
                   <BuildActionEntry
                      buildForTesting = "YES"
                      buildForRunning = "YES"
                      buildForProfiling = "YES"
                      buildForArchiving = "YES"
                      buildForAnalyzing = "YES">
                      <BuildableReference
                         BuildableIdentifier = "primary"
                         BlueprintIdentifier = "932F5B3E0822A1C700736975"
                         BuildableName = "JavaScriptCore.framework"
                         BlueprintName = "JavaScriptCore"
                         ReferencedContainer = "container:Source/JavaScriptCore/JavaScriptCore.xcodeproj">
                      </BuildableReference>
                   </BuildActionEntry>
                </BuildActionEntries>
             </BuildAction>
          </Scheme>
          SCHEME_EOF
          echo "--- injected WTFPrebuild + JavaScriptCore shared schemes (sequential invocations)"
          CFG=Release
          if [ "${{ matrix.san }}" = "debug" ]; then CFG=Debug; fi
          SAN=""
          if [ -f WebKitBuild/ASan ]; then SAN="ENABLE_ADDRESS_SANITIZER=YES"; fi
          if [ -f WebKitBuild/TSan ]; then SAN="ENABLE_THREAD_SANITIZER=YES"; fi
          echo "pre-build: configuration=$CFG sanitizer-flags=[$SAN]"
          set -o pipefail
          # Invocation 1/2: WTF (hard requirement - without wtf/Scripts and
          # wtf headers, every unified-source generator in the tree dies).
          xcodebuild -scheme WTFPrebuild \
            -UseSanitizedBuildSystemEnvironment=YES \
            -workspace "$PWD/WebKit.xcworkspace" \
            -configuration "$CFG" \
            $SAN \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            OTHER_CPLUSPLUSFLAGS='$(inherited) -Wno-missing-template-arg-list-after-template-kw -Wno-offsetof -Wno-c++11-narrowing-const-reference -Wno-deprecated-builtins -Wno-deprecated-literal-operator -Wno-extra-qualification -Wno-unnecessary-virtual-specifier -Wno-thread-safety-reference-return' \
            OTHER_CFLAGS='$(inherited) -Wno-missing-template-arg-list-after-template-kw -Wno-c++11-narrowing-const-reference -Wno-deprecated-builtins -Wno-deprecated-literal-operator -Wno-extra-qualification -Wno-unnecessary-virtual-specifier -Wno-thread-safety-reference-return' \
            SYMROOT="$PWD/WebKitBuild" \
            OBJROOT="$PWD/WebKitBuild" \
            SHARED_PRECOMPS_DIR="$PWD/WebKitBuild/PrecompiledHeaders" \
            ARCHS=arm64 SDKROOT=macosx \
            -parallelizeTargets=NO build > /tmp/wtf-prebuild.log 2>&1 || {
              echo "WTF pre-build FAILED; tail follows:"
              tail -400 /tmp/wtf-prebuild.log
              exit 1
            }
          echo "--- WTF pre-build OK; wtf/Scripts populated:"
          ls WebKitBuild/$CFG/usr/local/include/wtf/Scripts/ | head -8
          # Invocation 2/2: JavaScriptCore framework (soft - the fallback
          # patch below tolerates a missing InspectorBackendCommands.js).
          xcodebuild -scheme JavaScriptCore \
            -UseSanitizedBuildSystemEnvironment=YES \
            -workspace "$PWD/WebKit.xcworkspace" \
            -configuration "$CFG" \
            $SAN \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            OTHER_CPLUSPLUSFLAGS='$(inherited) -Wno-missing-template-arg-list-after-template-kw -Wno-offsetof -Wno-c++11-narrowing-const-reference -Wno-deprecated-builtins -Wno-deprecated-literal-operator -Wno-extra-qualification -Wno-unnecessary-virtual-specifier -Wno-thread-safety-reference-return' \
            OTHER_CFLAGS='$(inherited) -Wno-missing-template-arg-list-after-template-kw -Wno-c++11-narrowing-const-reference -Wno-deprecated-builtins -Wno-deprecated-literal-operator -Wno-extra-qualification -Wno-unnecessary-virtual-specifier -Wno-thread-safety-reference-return' \
            SUPPORTS_TEXT_BASED_API=NO \
            SYMROOT="$PWD/WebKitBuild" \
            OBJROOT="$PWD/WebKitBuild" \
            SHARED_PRECOMPS_DIR="$PWD/WebKitBuild/PrecompiledHeaders" \
            ARCHS=arm64 SDKROOT=macosx \
            -parallelizeTargets=NO build > /tmp/jscore-prebuild.log 2>&1 || {
              echo "JSC workspace pre-build FAILED; tail follows:"
              tail -400 /tmp/jscore-prebuild.log
            }
          echo "--- PrivateHeaders after pre-build:"
          ls -la WebKitBuild/$CFG/JavaScriptCore.framework/Versions/A/PrivateHeaders/ 2>/dev/null || echo "(framework PrivateHeaders not present - relying on fallback patch)"
          python3 - <<'PYEOF'
          p = "Source/WebInspectorUI/Scripts/copy-user-interface-resources.pl"
          s = open(p).read()
          old = 'or die "Copy of InspectorBackendCommands.js failed: $!";'
          new = 'or print STDERR "HARNESS-WARN: InspectorBackendCommands.js not present yet (CI serialization accommodation): $!\\n";'
          if old in s:
              open(p, "w").write(s.replace(old, new))
              print("patched copy-user-interface-resources.pl: die -> warn (fallback layer)")
          else:
              print("pattern not found in copy-user-interface-resources.pl (trunk variant?) - no fallback patch applied")
          PYEOF

      - name: Build WebKit (${{ matrix.san }}, Mac)
        run: |
          cd "$RUNNER_TEMP/webkit"
          # ATTEMPT-10: 2023-era sources under clang 26 trip NEW warning
          # classes (-Wdeprecated-literal-operator in WTFString.h,
          # -Winvalid-offsetof in Vector.h) that didn't exist under the
          # 2023 toolchain; Base.xcconfig sets
          # GCC_TREAT_WARNINGS_AS_ERRORS=YES so they are fatal. Overridden
          # to NO IDENTICALLY on prefix and fixed legs - a warnings-level
          # change with zero codegen effect.
          # NOTE: at these revisions webkitdirs reads ONLY the
          # WebKitBuild/ASan and WebKitBuild/TSan marker files
          # (determineASanIsEnabled/determineTSanIsEnabled); --asan/--tsan
          # are NOT build-webkit CLI flags and get passed through to
          # xcodebuild (which rejects them). The marker steps above are
          # what routes the sanitizer. --debug/--release select config only.
          # 2023-era build graphs expect pre-Xcode-26 SERIAL target
          # ordering; Xcode 26.6 parallel scheduling races three observed
          # generator/copy dependencies (JSC unified sources vs WTF headers;
          # WebInspectorUI resources vs InspectorBackendCommands.js; more
          # may exist). Global fix: -parallelizeTargets NO on the FULL
          # scheme (build-webkit passes extra args through to xcodebuild),
          # restoring serial ordering everywhere. Slower but correct for
          # old trees; harmless (slightly slower) for trunk.
          # Pre-builds are kept but now LOUD: pipefail + full exit codes.
          # ATTEMPT-13: clang 21 (Xcode 26.6) makes the C++26
          # strict-template-keyword rule a DEFAULT ERROR
          # (-Wmissing-template-arg-list-after-template-kw fires as an
          # error regardless of GCC_TREAT_WARNINGS_AS_ERRORS, killing
          # JSCast.h/LLIntData.h compiles in both the JSC prebuild and the
          # full build). Disabled via OTHER_CPLUSPLUSFLAGS/OTHER_CFLAGS
          # overrides with $(inherited) preserved, applied IDENTICALLY on
          # prefix and fixed legs - diagnostics-class only, zero codegen
          # effect. Also drops -Winvalid-offsetof (same class).
          set -o pipefail
          if [ "${{ matrix.san }}" = "debug" ]; then
            Tools/Scripts/build-webkit --debug -parallelizeTargets=NO GCC_TREAT_WARNINGS_AS_ERRORS=NO OTHER_CPLUSPLUSFLAGS='$(inherited) -Wno-missing-template-arg-list-after-template-kw -Wno-offsetof -Wno-c++11-narrowing-const-reference -Wno-deprecated-builtins -Wno-deprecated-literal-operator -Wno-extra-qualification -Wno-unnecessary-virtual-specifier -Wno-thread-safety-reference-return' OTHER_CFLAGS='$(inherited) -Wno-missing-template-arg-list-after-template-kw -Wno-c++11-narrowing-const-reference -Wno-deprecated-builtins -Wno-deprecated-literal-operator -Wno-extra-qualification -Wno-unnecessary-virtual-specifier -Wno-thread-safety-reference-return' SUPPORTS_TEXT_BASED_API=NO
          else
            Tools/Scripts/build-webkit --release -parallelizeTargets=NO GCC_TREAT_WARNINGS_AS_ERRORS=NO OTHER_CPLUSPLUSFLAGS='$(inherited) -Wno-missing-template-arg-list-after-template-kw -Wno-offsetof -Wno-c++11-narrowing-const-reference -Wno-deprecated-builtins -Wno-deprecated-literal-operator -Wno-extra-qualification -Wno-unnecessary-virtual-specifier -Wno-thread-safety-reference-return' OTHER_CFLAGS='$(inherited) -Wno-missing-template-arg-list-after-template-kw -Wno-c++11-narrowing-const-reference -Wno-deprecated-builtins -Wno-deprecated-literal-operator -Wno-extra-qualification -Wno-unnecessary-virtual-specifier -Wno-thread-safety-reference-return' SUPPORTS_TEXT_BASED_API=NO
          fi

      - name: Copy iframe-variant test into the tree
        if: env.SECONDARY_TEST_PATH != ''
        run: |
          cd "$RUNNER_TEMP/webkit"
          if [ -z "$SECONDARY_TEST_PATH" ]; then exit 0; fi
          mkdir -p "LayoutTests/$(dirname "$SECONDARY_TEST_PATH")"
          cat > "LayoutTests/$SECONDARY_TEST_PATH" <<'EOF'
          <!DOCTYPE html><!-- webkit-test-runner [ ThreadedTimeBasedAnimationsEnabled=true ] -->
          <html>
          <body>
          <script>
          if (window.testRunner) {
              testRunner.dumpAsText();
              testRunner.waitUntilDone();
          }
          let cycle = 0;
          const maxCycles = 30;
          function finish() {
              document.body.textContent = "PASS if no crash in the UI process during iframe teardown.";
              if (window.testRunner)
                  testRunner.notifyDone();
          }
          function runCycle() {
              if (cycle++ >= maxCycles)
                  return finish();
              let iframe = document.createElement("iframe");
              iframe.style.width = "200px";
              iframe.style.height = "200px";
              document.body.appendChild(iframe);
              iframe.srcdoc =
                  '<div style="width:50px;height:50px;background:green;animation:s 10s linear infinite;will-change:transform"></div>' +
                  '<style>@keyframes s{from{transform:rotate(0)}to{transform:rotate(360deg)}}</style>';
              requestAnimationFrame(() => {
                  requestAnimationFrame(() => {
                      iframe.remove();
                      setTimeout(runCycle, 0);
                  });
              });
          }
          runCycle();
          </script>
          </body>
          </html>
          EOF
          ls -la "LayoutTests/$SECONDARY_TEST_PATH"

      - name: Run both tests N times (WebKitTestRunner)
        continue-on-error: true
        run: |
          cd "$RUNNER_TEMP/webkit"
          mkdir -p "$RUNNER_TEMP/iterations"
          pass=0; nonpass=0
          for i in $(seq 1 "$LEG_ITERATIONS"); do
            SECONDARY=""
            [ "$SECONDARY_TEST_PATH" != "none" ] && SECONDARY="$SECONDARY_TEST_PATH"
            for TEST in "$TEST_PATH" "$SECONDARY"; do
              [ -n "$TEST" ] || continue
              TAG="$(echo "$TEST" | tr '/' '_')"
              rc=0
              Tools/Scripts/run-webkit-tests "$TEST" \
                --no-build --no-show-results --no-retry \
                --results-dir "$RUNNER_TEMP/iterations/run${i}-${TAG}" \
                >/dev/null 2>&1 || rc=$?
              RES="$RUNNER_TEMP/iterations/run${i}-${TAG}/full_results.json"
              VERDICT="unknown"
              if grep -q '"num_regressions":0' "$RES" 2>/dev/null && grep -q '"num_passes":1' "$RES" 2>/dev/null; then
                VERDICT="pass"; pass=$((pass+1))
              else
                VERDICT="nonpass"; nonpass=$((nonpass+1))
              fi
              echo "iteration=$i test=$TEST rc=$rc verdict=$VERDICT"
              echo "iteration=$i test=$TEST rc=$rc verdict=$VERDICT" >> "$RUNNER_TEMP/iterations/log.txt"
            done
          done
          echo "TOTAL pass=$pass nonpass=$nonpass (x2 tests x $LEG_ITERATIONS iterations)"
          echo "TOTAL pass=$pass nonpass=$nonpass (x2 tests x $LEG_ITERATIONS iterations)" >> "$RUNNER_TEMP/iterations/log.txt"

      - name: Verdict + evidence collection
        if: always()
        run: |
          cd "$RUNNER_TEMP"
          mkdir -p evidence
          {
            echo "=== leg=${{ matrix.leg }} san=${{ matrix.san }} webkit_ref=${{ matrix.webkit_ref }} ==="
            date
            echo
            echo "--- iteration verdict log ---"
            sort iterations/log.txt 2>/dev/null | uniq -c | sort -rn | head -20
            echo
            echo "--- WK-INTERPOSE log (the primitive oracle) ---"
            cat /tmp/wk-interpose-log.txt 2>/dev/null || echo "(no interpose log)"
            echo
            echo "--- ASan / TSan / assert frame greps ---"
            grep -rEai "heap-use-after-free|use-after-poison|ERROR: AddressSanitizer|WARNING: ThreadSanitizer|data race|ASSERTION|assertion|__invoke|TimerBase|RemoteLayerTreeEventDispatcher|scheduleDelayedRenderingUpdateDetectionTimer" \
              iterations 2>/dev/null | head -400
            echo
            echo "--- any non-pass full_results ---"
            for d in iterations/run*; do
              [ -f "$d/full_results.json" ] || continue
              if ! grep -q '"num_regressions":0' "$d/full_results.json" 2>/dev/null; then
                echo "===== $d ====="; sed -n '1,80p' "$d/full_results.json" 2>/dev/null
              fi
            done
            echo
            echo "--- crash-log files ---"
            find iterations \( -name "*crash-log*" -o -name "*stderr*" \) 2>/dev/null | head -40
            echo
            echo "--- macOS DiagnosticReports ---"
            ls -lt ~/Library/Logs/DiagnosticReports 2>/dev/null | head -11
          } > evidence/verdict.txt 2>&1
          cp /tmp/wk-interpose-log.txt evidence/ 2>/dev/null || true
          cp -R ~/Library/Logs/DiagnosticReports evidence/crash-reports 2>/dev/null || true
          cat evidence/verdict.txt || true
          exit 0

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-b-v5-${{ matrix.leg }}-${{ matrix.san }}
          path: |
            ${{ runner.temp }}/evidence
            ${{ runner.temp }}/iterations
          if-no-files-found: warn
          retention-days: 90