name: stage-b-315533

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: "Test iterations per leg (the race is timing-dependent)"
        required: false
        default: "40"
      legs:
        description: "Which legs to run (comma-separated: prefix,fixed)"
        required: false
        default: "prefix,fixed"

permissions: {}

concurrency:
  group: stage-b-315533
  cancel-in-progress: false

env:
  WEBKIT_FIX_REF: "2df698f59386b2ffccd45c7ef28422b69eba8c44"
  TEST_PATH: "fast/scrolling/mac/event-dispatcher-timer-close-crash.html"
  IFRAME_TEST_PATH: "fast/scrolling/mac/event-dispatcher-timer-iframe-crash.html"
  ASAN_OPTIONS: "detect_leaks=0"

jobs:
  asan-differential:
    name: "ASan differential - ${{ matrix.leg }}"
    runs-on: macos-26
    # GitHub-hosted runners hard-cap jobs at 6h; build alone takes 4.5-5.7h
    # depending on runner contention (v2 prefix leg hit the old 350m cap
    # mid-build and was cancelled). 358m leaves test time inside the cap.
    timeout-minutes: 358
    if: contains(github.event.inputs.legs || 'prefix,fixed', matrix.leg)
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: prefix
            webkit_ref: "55d9d9007f54ee61fa38accb59cd88a8d4075847"
          - leg: fixed
            webkit_ref: "2df698f59386b2ffccd45c7ef28422b69eba8c44"
    steps:
      - name: Host + toolchain report
        run: |
          sw_vers
          ls -d /Applications/Xcode*.app || true
          XCODE_APP=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          sysctl -n hw.ncpu hw.memsize
          cmake --version | head -1
          python3 --version
          perl -v | sed -n '2p'
          ruby --version || true

      - name: Ensure ninja
        run: |
          if ! xcrun -find ninja >/dev/null 2>&1 && ! command -v ninja >/dev/null 2>&1; then
            brew install ninja
          fi
          (xcrun -find ninja 2>/dev/null || command -v ninja)

      - name: Shallow-clone WebKit at ${{ matrix.webkit_ref }}
        run: |
          rm -rf "$RUNNER_TEMP/webkit"
          git init "$RUNNER_TEMP/webkit"
          cd "$RUNNER_TEMP/webkit"
          git remote add origin https://github.com/WebKit/WebKit.git
          git -c protocol.version=2 fetch --depth 1 origin "${{ matrix.webkit_ref }}"
          git checkout FETCH_HEAD
          echo "HEAD: $(git rev-parse HEAD)"

      - name: Import regression test from the fix commit (absent at parent)
        if: matrix.leg == 'prefix'
        run: |
          cd "$RUNNER_TEMP/webkit"
          git -c protocol.version=2 fetch --depth 1 origin "$WEBKIT_FIX_REF"
          git checkout FETCH_HEAD -- \
            "LayoutTests/$TEST_PATH" \
            "LayoutTests/fast/scrolling/mac/event-dispatcher-timer-close-crash-expected.txt"
          ls -la LayoutTests/fast/scrolling/mac/event-dispatcher-timer-close-crash*

      - name: Build-dir markers (Release + ASan routing)
        run: |
          cd "$RUNNER_TEMP/webkit"
          mkdir -p WebKitBuild
          printf 'Release\n' > WebKitBuild/Configuration
          printf 'YES\n' > WebKitBuild/ASan
          grep -n "cmake-mac" Tools/Scripts/webkitdirs.pm | head -3 || true

      - name: Build WebKit (Release + ASan, Mac)
        run: |
          cd "$RUNNER_TEMP/webkit"
          Tools/Scripts/build-webkit --release --asan

      # Single-run v1 (2026-10-27): both legs PASSED, no ASan report, no
      # DiagnosticReports -> the race did not hit in 30 cycles on this
      # runner/timing. v2 repeats the test N times per leg and adds the
      # iframe-removal variant (the shape the PS5 console repro uses).
      - name: Copy iframe-variant test into the tree
        run: |
          cd "$RUNNER_TEMP/webkit"
          mkdir -p "LayoutTests/$(dirname "$IFRAME_TEST_PATH")"
          cat > "LayoutTests/$IFRAME_TEST_PATH" <<'EOF'
          <!DOCTYPE html><!-- webkit-test-runner [ ThreadedTimeBasedAnimationsEnabled=true ] -->
          <html>
          <body>
          <script>
          if (window.testRunner) {
              testRunner.dumpAsText();
              testRunner.waitUntilDone();
          }
          let cycle = 0;
          const maxCycles = 30;
          function finish() {
              document.body.textContent = "PASS if no crash in the UI process during iframe teardown.";
              if (window.testRunner)
                  testRunner.notifyDone();
          }
          function runCycle() {
              if (cycle++ >= maxCycles)
                  return finish();
              let iframe = document.createElement("iframe");
              iframe.style.width = "200px";
              iframe.style.height = "200px";
              document.body.appendChild(iframe);
              iframe.srcdoc =
                  '<div style="width:50px;height:50px;background:green;animation:s 10s linear infinite;will-change:transform"></div>' +
                  '<style>@keyframes s{from{transform:rotate(0)}to{transform:rotate(360deg)}}</style>';
              requestAnimationFrame(() => {
                  requestAnimationFrame(() => {
                      iframe.remove();
                      setTimeout(runCycle, 0);
                  });
              });
          }
          runCycle();
          </script>
          </body>
          </html>
          EOF
          ls -la "LayoutTests/$IFRAME_TEST_PATH"

      - name: Run both tests N times (WebKitTestRunner)
        continue-on-error: true
        env:
          ITERATIONS: ${{ github.event.inputs.iterations || '40' }}
        run: |
          cd "$RUNNER_TEMP/webkit"
          mkdir -p "$RUNNER_TEMP/iterations"
          pass=0; crash=0; other=0
          for i in $(seq 1 "$ITERATIONS"); do
            for TEST in "$TEST_PATH" "$IFRAME_TEST_PATH"; do
              TAG="$(echo "$TEST" | tr '/' '_')"
              Tools/Scripts/run-webkit-tests "$TEST" \
                --no-build --no-show-results --no-retry \
                --results-dir "$RUNNER_TEMP/iterations/run${i}-${TAG}" \
                >/dev/null 2>&1
              rc=$?
              RES="$RUNNER_TEMP/iterations/run${i}-${TAG}/full_results.json"
              VERDICT="unknown"
              if grep -q '"num_regressions":0' "$RES" 2>/dev/null && grep -q '"num_passes":1' "$RES" 2>/dev/null; then
                VERDICT="pass"; pass=$((pass+1))
              elif grep -Eq '"(num_regressions|num_missing)":[1-9]' "$RES" 2>/dev/null; then
                VERDICT="nonpass"; other=$((other+1))
              else
                VERDICT="nonpass"; other=$((other+1))
              fi
              echo "iteration=$i test=$TEST rc=$rc verdict=$VERDICT"
              echo "iteration=$i test=$TEST rc=$rc verdict=$VERDICT" >> "$RUNNER_TEMP/iterations/log.txt"
            done
          done
          echo "TOTAL pass=$pass nonpass=$other (x2 tests x $ITERATIONS iterations)"
          echo "TOTAL pass=$pass nonpass=$other (x2 tests x $ITERATIONS iterations)" >> "$RUNNER_TEMP/iterations/log.txt"

      - name: Verdict + evidence collection
        if: always()
        run: |
          cd "$RUNNER_TEMP"
          mkdir -p evidence
          {
            echo "=== leg=${{ matrix.leg }} webkit_ref=${{ matrix.webkit_ref }} ==="
            date
            echo
            echo "--- iteration verdict log ---"
            cat iterations/log.txt 2>/dev/null | sort | uniq -c | sort -rn | head -20
            cat iterations/log.txt 2>/dev/null | head -200
            echo
            echo "--- ASan / UAF frame greps over ALL iteration output ---"
            grep -rEai "heap-use-after-free|ERROR: AddressSanitizer|__invoke|TimerBase|RemoteLayerTreeEventDispatcher|scheduleDelayedRenderingUpdateDetectionTimer" \
              iterations 2>/dev/null | head -400
            echo
            echo "--- any non-pass full_results ---"
            for d in iterations/run*; do
              [ -f "$d/full_results.json" ] || continue
              if ! grep -q '"num_regressions":0' "$d/full_results.json" 2>/dev/null; then
                echo "===== $d ====="; sed -n '1,80p' "$d/full_results.json" 2>/dev/null
              fi
            done
            echo
            echo "--- macOS DiagnosticReports (top 10) ---"
            ls -lt ~/Library/Logs/DiagnosticReports 2>/dev/null | head -11
          } > evidence/verdict.txt 2>&1
          cp -R ~/Library/Logs/DiagnosticReports evidence/crash-reports 2>/dev/null || true
          cat evidence/verdict.txt || true
          exit 0

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-b-${{ matrix.leg }}
          path: |
            ${{ runner.temp }}/evidence
            ${{ runner.temp }}/iterations
          if-no-files-found: warn
          retention-days: 90