name: stage-b-315533

on:
  workflow_dispatch:
    inputs:
      matrix_json:
        description: "Matrix JSON array of legs (leg, webkit_ref, san, iterations)"
        required: false
        default: >-
          [{"leg":"prefix","webkit_ref":"55d9d9007f54ee61fa38accb59cd88a8d4075847","san":"debug","iterations":"12"},
           {"leg":"fixed","webkit_ref":"2df698f59386b2ffccd45c7ef28422b69eba8c44","san":"debug","iterations":"12"},
           {"leg":"prefix","webkit_ref":"55d9d9007f54ee61fa38accb59cd88a8d4075847","san":"tsan","iterations":"12"},
           {"leg":"fixed","webkit_ref":"2df698f59386b2ffccd45c7ef28422b69eba8c44","san":"tsan","iterations":"12"},
           {"leg":"prefix","webkit_ref":"55d9d9007f54ee61fa38accb59cd88a8d4075847","san":"asan","iterations":"40"}]

permissions: {}

concurrency:
  group: stage-b-315533
  cancel-in-progress: false

env:
  WEBKIT_FIX_REF: "2df698f59386b2ffccd45c7ef28422b69eba8c44"
  TEST_PATH: "fast/scrolling/mac/event-dispatcher-timer-close-crash.html"
  IFRAME_TEST_PATH: "fast/scrolling/mac/event-dispatcher-timer-iframe-crash.html"
  ASAN_OPTIONS: "detect_leaks=0"

jobs:
  asan-differential:
    name: "Stage B - ${{ matrix.leg }} - ${{ matrix.san }}"
    runs-on: macos-26
    # GitHub-hosted runners hard-cap jobs at 6h; builds take 4.5-5.7h.
    timeout-minutes: 358
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include: ${{ fromJSON(inputs.matrix_json) }}
    env:
      LEG_ITERATIONS: ${{ matrix.iterations }}
    steps:
      - name: Host + toolchain report
        run: |
          sw_vers
          ls -d /Applications/Xcode*.app || true
          XCODE_APP=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          sysctl -n hw.ncpu hw.memsize
          cmake --version | head -1
          perl -v | sed -n '2p'

      - name: Ensure ninja
        run: |
          if ! xcrun -find ninja >/dev/null 2>&1 && ! command -v ninja >/dev/null 2>&1; then
            brew install ninja
          fi
          (xcrun -find ninja 2>/dev/null || command -v ninja)

      - name: Shallow-clone WebKit at ${{ matrix.webkit_ref }}
        run: |
          rm -rf "$RUNNER_TEMP/webkit"
          git init "$RUNNER_TEMP/webkit"
          cd "$RUNNER_TEMP/webkit"
          git remote add origin https://github.com/WebKit/WebKit.git
          git -c protocol.version=2 fetch --depth 1 origin "${{ matrix.webkit_ref }}"
          git checkout FETCH_HEAD
          echo "HEAD: $(git rev-parse HEAD)"

      - name: Import regression test from the fix commit (absent at parent)
        if: matrix.leg == 'prefix'
        run: |
          cd "$RUNNER_TEMP/webkit"
          git -c protocol.version=2 fetch --depth 1 origin "$WEBKIT_FIX_REF"
          git checkout FETCH_HEAD -- \
            "LayoutTests/$TEST_PATH" \
            "LayoutTests/fast/scrolling/mac/event-dispatcher-timer-close-crash-expected.txt"
          ls -la LayoutTests/fast/scrolling/mac/event-dispatcher-timer-close-crash*

      - name: Build-dir markers (sanitizer routing)
        run: |
          cd "$RUNNER_TEMP/webkit"
          mkdir -p WebKitBuild
          if [ "${{ matrix.san }}" = "debug" ]; then
            printf 'Debug\n' > WebKitBuild/Configuration
          else
            printf 'Release\n' > WebKitBuild/Configuration
            if [ "${{ matrix.san }}" = "asan" ]; then printf 'YES\n' > WebKitBuild/ASan; fi
            if [ "${{ matrix.san }}" = "tsan" ]; then printf 'YES\n' > WebKitBuild/TSan; fi
          fi
          cat WebKitBuild/Configuration
          ls WebKitBuild/

      - name: Build WebKit (${{ matrix.san }}, Mac)
        run: |
          cd "$RUNNER_TEMP/webkit"
          if [ "${{ matrix.san }}" = "debug" ]; then
            Tools/Scripts/build-webkit --debug
          elif [ "${{ matrix.san }}" = "tsan" ]; then
            Tools/Scripts/build-webkit --release --tsan
          else
            Tools/Scripts/build-webkit --release --asan
          fi

      # v3 lesson: the pre-fix timer is DESTROYED ON THE MAIN THREAD while its
      # run loop is the SCROLLING thread's. ~TimerBase asserts
      # RunLoop::isCurrent() (RELEASE_ASSERT, RunLoop.h assertIsCurrent)
      # in Debug builds -> a Debug parent build should abort DETERMINISTICALLY
      # whenever the timer is armed at teardown, no race-window luck needed.
      # The fixed build destroys the timer ON the scrolling thread -> clean.
      # TSan additionally detects unsynchronized member writes (lazy creation
      # on the scrolling thread vs teardown on the main thread) as data races,
      # broader than the ASan free/use window.
      - name: Copy iframe-variant test into the tree
        run: |
          cd "$RUNNER_TEMP/webkit"
          mkdir -p "LayoutTests/$(dirname "$IFRAME_TEST_PATH")"
          cat > "LayoutTests/$IFRAME_TEST_PATH" <<'EOF'
          <!DOCTYPE html><!-- webkit-test-runner [ ThreadedTimeBasedAnimationsEnabled=true ] -->
          <html>
          <body>
          <script>
          if (window.testRunner) {
              testRunner.dumpAsText();
              testRunner.waitUntilDone();
          }
          let cycle = 0;
          const maxCycles = 30;
          function finish() {
              document.body.textContent = "PASS if no crash in the UI process during iframe teardown.";
              if (window.testRunner)
                  testRunner.notifyDone();
          }
          function runCycle() {
              if (cycle++ >= maxCycles)
                  return finish();
              let iframe = document.createElement("iframe");
              iframe.style.width = "200px";
              iframe.style.height = "200px";
              document.body.appendChild(iframe);
              iframe.srcdoc =
                  '<div style="width:50px;height:50px;background:green;animation:s 10s linear infinite;will-change:transform"></div>' +
                  '<style>@keyframes s{from{transform:rotate(0)}to{transform:rotate(360deg)}}</style>';
              requestAnimationFrame(() => {
                  requestAnimationFrame(() => {
                      iframe.remove();
                      setTimeout(runCycle, 0);
                  });
              });
          }
          runCycle();
          </script>
          </body>
          </html>
          EOF
          ls -la "LayoutTests/$IFRAME_TEST_PATH"

      - name: Run both tests N times (WebKitTestRunner) under CPU pressure
        continue-on-error: true
        run: |
          cd "$RUNNER_TEMP/webkit"
          mkdir -p "$RUNNER_TEMP/iterations"
          # Scheduler pressure: oversubscribe the runner so the scrolling
          # thread is more likely to be preempted mid-callback (race amplifier).
          SPIN_PIDS=""
          for s in 1 2 3 4; do yes > /dev/null 2>&1 & SPIN_PIDS="$SPIN_PIDS $!"; done
          pass=0; nonpass=0
          for i in $(seq 1 "$LEG_ITERATIONS"); do
            for TEST in "$TEST_PATH" "$IFRAME_TEST_PATH"; do
              TAG="$(echo "$TEST" | tr '/' '_')"
              rc=0
              Tools/Scripts/run-webkit-tests "$TEST" \
                --no-build --no-show-results --no-retry \
                --results-dir "$RUNNER_TEMP/iterations/run${i}-${TAG}" \
                >/dev/null 2>&1 || rc=$?
              RES="$RUNNER_TEMP/iterations/run${i}-${TAG}/full_results.json"
              VERDICT="unknown"
              if grep -q '"num_regressions":0' "$RES" 2>/dev/null && grep -q '"num_passes":1' "$RES" 2>/dev/null; then
                VERDICT="pass"; pass=$((pass+1))
              else
                VERDICT="nonpass"; nonpass=$((nonpass+1))
              fi
              echo "iteration=$i test=$TEST rc=$rc verdict=$VERDICT"
              echo "iteration=$i test=$TEST rc=$rc verdict=$VERDICT" >> "$RUNNER_TEMP/iterations/log.txt"
            done
          done
          kill $SPIN_PIDS 2>/dev/null || true
          echo "TOTAL pass=$pass nonpass=$nonpass (x2 tests x $LEG_ITERATIONS iterations)"
          echo "TOTAL pass=$pass nonpass=$nonpass (x2 tests x $LEG_ITERATIONS iterations)" >> "$RUNNER_TEMP/iterations/log.txt"

      - name: Verdict + evidence collection
        if: always()
        run: |
          cd "$RUNNER_TEMP"
          mkdir -p evidence
          {
            echo "=== leg=${{ matrix.leg }} san=${{ matrix.san }} webkit_ref=${{ matrix.webkit_ref }} ==="
            date
            echo
            echo "--- iteration verdict log (tally) ---"
            sort iterations/log.txt 2>/dev/null | uniq -c | sort -rn | head -20
            echo
            echo "--- ASan / TSan / assert frame greps over ALL iteration output ---"
            grep -rEai "heap-use-after-free|use-after-poison|ERROR: AddressSanitizer|WARNING: ThreadSanitizer|ThreadSanitizer:|data race|assertion|ASSERT.*failed|__invoke|TimerBase|RemoteLayerTreeEventDispatcher|scheduleDelayedRenderingUpdateDetectionTimer" \
              iterations 2>/dev/null | head -400
            echo
            echo "--- any non-pass full_results ---"
            for d in iterations/run*; do
              [ -f "$d/full_results.json" ] || continue
              if ! grep -q '"num_regressions":0' "$d/full_results.json" 2>/dev/null; then
                echo "===== $d ====="; sed -n '1,80p' "$d/full_results.json" 2>/dev/null
              fi
            done
            echo
            echo "--- crash-log files found ---"
            find iterations \( -name "*crash-log*" -o -name "*stderr*" \) 2>/dev/null | head -40
            echo
            echo "--- macOS DiagnosticReports (top 10) ---"
            ls -lt ~/Library/Logs/DiagnosticReports 2>/dev/null | head -11
          } > evidence/verdict.txt 2>&1
          cp -R ~/Library/Logs/DiagnosticReports evidence/crash-reports 2>/dev/null || true
          cat evidence/verdict.txt || true
          exit 0

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-b-v4-${{ matrix.leg }}-${{ matrix.san }}
          path: |
            ${{ runner.temp }}/evidence
            ${{ runner.temp }}/iterations
          if-no-files-found: warn
          retention-days: 90