<!DOCTYPE html><!-- webkit-test-runner [ ThreadedTimeBasedAnimationsEnabled=true ] -->
<html>
<body>
<script>
// Iframe-removal variant of the upstream BZ 315533 regression test
// (fast/scrolling/mac/event-dispatcher-timer-close-crash.html, commit 2df698f).
// The upstream test tears the RemoteLayerTreeEventDispatcher down by closing a
// popup window; this variant tears it down by removing a composited iframe
// after two rAFs, matching the shape used on the PS5 console repro.
if (window.testRunner) {
    testRunner.dumpAsText();
    testRunner.waitUntilDone();
}

let cycle = 0;
const maxCycles = 30;

function finish() {
    document.body.textContent = "PASS if no crash in the UI process during iframe teardown.";
    if (window.testRunner)
        testRunner.notifyDone();
}

function runCycle() {
    if (cycle++ >= maxCycles)
        return finish();

    let iframe = document.createElement("iframe");
    iframe.style.width = "200px";
    iframe.style.height = "200px";
    document.body.appendChild(iframe);

    iframe.srcdoc =
        '<div style="width:50px;height:50px;background:green;animation:s 10s linear infinite;will-change:transform"></div>' +
        '<style>@keyframes s{from{transform:rotate(0)}to{transform:rotate(360deg)}}</style>';

    // Wait two main-thread rAFs so the iframe gets a layer-tree commit and the
    // scrolling-thread display link observer registers, scheduling the 1ms timer.
    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            iframe.remove();
            // Removing the composited iframe destroys its scrolling-tree state on
            // the main thread. Race against the scrolling-thread timer callback.
            setTimeout(runCycle, 0);
        });
    });
}

runCycle();
</script>
</body>
</html>
